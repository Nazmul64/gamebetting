<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Spine</title>
  <script src="pixi.min.js"></script>
  <script src="pixi-spine.js"></script>
  <script src="gsap.min.js"></script>
</head>
<body style="background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh;">
  <div id="output" style="color: #fff; font-family: monospace; position: absolute; top: 10px; left: 10px; z-index: 99;">Loading...</div>
  <canvas id="view"></canvas>
  <script>
    async function init() {
      const log = (msg) => {
        console.log(msg);
        document.getElementById('output').innerHTML += '<br>' + msg;
      };

      try {
        const app = new PIXI.Application({
          view: document.getElementById('view'),
          width: 1920,
          height: 1080,
          backgroundColor: 0x110515
        });

        log('Pixi Initialized: ' + PIXI.VERSION);
        log('Pixi Spine available: ' + (!!PIXI.spine));

        // Test loading dragon
        PIXI.Assets.add({ alias: 'dragonSkel', src: 'dragon.skel', data: { spineAtlasFile: 'dragon.atlas' } });
        const resource = await PIXI.Assets.load('dragonSkel');
        log('Dragon loaded: ' + !!resource);
        
        const spineData = resource.spineData;
        log('Dragon animations: ' + spineData.animations.map(a => a.name).join(', '));

        const dragon = new PIXI.spine.Spine(spineData);
        dragon.x = 400;
        dragon.y = 800;
        dragon.scale.set(0.8);
        dragon.state.setAnimation(0, 'idle', true);
        app.stage.addChild(dragon);

        log('Dragon added to stage successfully!');
      } catch (err) {
        log('Error: ' + err.message + '<br>' + err.stack);
      }
    }
    init();
  </script>
</body>
</html>
