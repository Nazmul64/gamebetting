<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150">
  <rect x="2" y="2" width="96" height="146" rx="6" fill="#ffffff" stroke="#cfd3dc" stroke-width="1.5"/>
  <g fill="#111827" font-family="'Trebuchet MS', Arial, sans-serif">
    <!-- Top Left -->
    <text x="11" y="19" font-size="15" font-weight="bold" text-anchor="middle">K</text>
    <text x="11" y="32" font-size="14" text-anchor="middle">♠</text>
    
    <!-- Bottom Right (Rotated) -->
    <g transform="rotate(180 50 75)">
      <text x="11" y="19" font-size="15" font-weight="bold" text-anchor="middle">K</text>
      <text x="11" y="32" font-size="14" text-anchor="middle">♠</text>
    </g>

    <!-- Center Pips -->
    <g font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Segoe UI Symbol', sans-serif">
      
      <rect x="22" y="28" width="56" height="94" rx="4" fill="#faf5eb" stroke="#d4af37" stroke-width="1.5"/>
      <circle cx="50" cy="62" r="18" fill="#f5e6ba" stroke="#8a1a36" stroke-width="1.5"/>
      <text x="50" y="68" font-size="22" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="bold">K</text>
      <text x="50" y="98" font-size="22" text-anchor="middle">♠</text>
      <text x="50" y="116" font-size="9" font-family="sans-serif" font-weight="bold" letter-spacing="1" fill="#78350f" text-anchor="middle">KING</text>
    
    </g>
